<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="darkreader-lock">
<!-- 深色模式：第一幀就套上使用者選的（不等 app.js，免得畫面先白再黑）。鍵名和 app.js 的 THEME_KEY 一樣 -->
<script>(function(){try{var t=localStorage.getItem("udl-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<title>陪伴他的人，不只一個</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 畫面上的字都在 content.js；這個檔只有骨架。
     例外（沒有 JavaScript 或 content.js 壞掉時 content.js 讀不到）：title、noscript、#content-error 這三處。 -->
<a tabindex="0" class="skip-link" id="skip" href="#app"></a>
<div class="wrap">
  <!-- 固定在最上面的導覽列：上一步（或首頁）、設定；題目頁下面多一條進度 -->
  <div class="topbar" id="topbar">
  <header class="top">
    <a tabindex="0" class="tool quiet" id="back" href="#/home" hidden><span aria-hidden="true">‹</span><span id="back-label"></span></a>
    <nav class="tabs" id="tabs" hidden></nav>
    <!-- 右上角三顆直接按：深色、大字、唸給我聽。中間留間隔，免得按錯（深色預設跟著系統；2026-11-18 參賽者：深色移到大字左邊） -->
    <div class="tools">
      <button type="button" class="tool" id="theme" aria-pressed="false"><span id="theme-label"></span><span class="tool-state" id="theme-state" aria-hidden="true"></span></button>
      <button type="button" class="tool" id="big" aria-pressed="false"><span id="big-label"></span><span class="tool-state" id="big-state" aria-hidden="true"></span></button>
      <button type="button" class="tool" id="speak"><span aria-hidden="true">🔊</span><span id="speak-label"></span></button>
    </div>
  </header>
  <div class="progress" id="progress" hidden></div>
  </div>
  <p class="notice" id="notice" hidden></p>
  <p class="notice" id="content-error" hidden>內容檔有錯：content.js 讀不到或格式壞了（常見原因是少了逗號或引號）。請把它改回上一個可以用的版本。</p>
  <p class="status" id="status" role="status"></p>
  <main id="app" tabindex="-1"></main>
</div>
<noscript><p class="notice">這一頁需要開啟 JavaScript 才能使用。</p></noscript>
<script src="content.js"></script>
<script src="data-institutions.js"></script>
<script src="data-windows.js"></script>
<script src="app.js"></script>
</body>
</html>
